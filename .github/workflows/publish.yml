name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. "v0.7.2"'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_dispatch the default checkout is the branch the run was
          # started from, not the tag being published.
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is not a vX.Y.Z tag" >&2
            exit 1
          fi
          tag_version="${TAG#v}"
          pkg_version=$(grep -oP '(?<=__version__ = ")[^"]+' src/deep_wiki_agent/__init__.py)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${TAG} does not match package version ${pkg_version}" >&2
            exit 1
          fi
      - run: uv build
      - name: Verify the skill stays out of the wheel
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          contents=$(python -m zipfile -l "$wheel")
          if grep -q 'deep_wiki_agent/skills/' <<<"$contents"; then
            echo "::error::the okf-wiki skill leaked into the wheel" >&2
            exit 1
          fi
          grep -q 'deep_wiki_agent/okf_lint.py' <<<"$contents"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
