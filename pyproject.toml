[project]
name = "deep-wiki-agent"
dynamic = ["version"]
description = "LangChain deepagents that maintain and consult a wiki knowledge base in Open Knowledge Format (OKF)."
readme = "README.md"
authors = [
    { name = "Hawk", email = "francesco.giurlanda@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["langchain", "deepagents", "okf", "knowledge-base", "wiki", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # Capped below 0.7: the linter is only attachable to a `FilesystemBackend`,
    # which this package type-checks against directly. Lift the cap once that
    # backend surface is stable across a minor release.
    "deepagents>=0.6.5,<0.7",
    "langchain>=1.0,<2.0",
    # Already in the tree through langchain; declared because `WikiAnswer` puts
    # a Pydantic model on this package's public API.
    "pydantic>=2.0,<3.0",
]

[project.scripts]
# The validator is stdlib-only by design: a bundle stays verifiable by anyone
# holding the directory, and `uvx`/`pipx` make that a one-liner.
okf-lint = "deep_wiki_agent.okf_lint:main"

[project.urls]
Homepage = "https://github.com/giurlanda/deep-wiki-agent"
Repository = "https://github.com/giurlanda/deep-wiki-agent"
Documentation = "https://giurlanda.github.io/deep-wiki-agent/"
Changelog = "https://github.com/giurlanda/deep-wiki-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    # Pinned below 2.0: MkDocs 2.0 removes the plugin system, which mkdocstrings
    # and mkdocs-material both depend on.
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

examples = [
    "langchain-openai>=1.0,<2.0",
    "colorama",
    # For `examples/semantic_wiki.py`: one concrete hybrid store, so the
    # example runs. The library itself pins no vector store.
    "langchain-qdrant>=0.2",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
]

# Opt-in loader stack for `create_read_document_tool`. Enumerated rather than
# `markitdown[all]`, which additionally pulls the Azure SDKs and the audio
# transcription chain — neither is reachable from a bundle's `raw/` directory.
documents = [
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1,<0.2",
]

# Opt-in stack for `create_semantic_tools` and the factories' `embeddings` /
# `vector_store` parameters. It includes `documents` because ingestion has to
# read whatever sits in `raw/`, and a PDF there is the common case, not the
# exception. No vector store is pinned: which one to use is the caller's
# decision, and the bundle stays a directory either way.
semantic = [
    "deep-wiki-agent[documents]",
    "langchain-text-splitters>=0.3,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/deep_wiki_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_wiki_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Any is the right type for **kwargs passed straight through
    "COM812",  # conflicts with the formatter
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "PLR0913", # factories are configuration surfaces; many kwargs is the point
]

[tool.ruff.lint.per-file-ignores]
# Tests: no annotations/docstrings required; function-local imports keep a
# fixture's dependencies next to it; private attribute access is the point of
# the wiring assertions.
"tests/*" = ["ANN", "D", "INP001", "PLC0415", "PLR2004", "S101", "SLF001", "TC"]
"examples/*" = ["D", "INP001", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
